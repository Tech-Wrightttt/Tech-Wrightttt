<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" width="100%" height="100%">
  <defs>
    <linearGradient id="palaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120306"/>
      <stop offset="50%" stop-color="#1A050A"/>
      <stop offset="100%" stop-color="#080204"/>
    </linearGradient>

    <linearGradient id="stealthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="100%" stop-color="#FFE600"/>
    </linearGradient>

    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes thiefScan {
      0% { transform: translate(40px, 60px); }
      20% { transform: translate(220px, 84px); }
      40% { transform: translate(440px, 60px); }
      60% { transform: translate(620px, 108px); }
      80% { transform: translate(780px, 84px); }
      100% { transform: translate(840px, 60px); }
    }
    @keyframes tileFlicker1 {
      0%, 100% { fill: #330008; }
      50% { fill: #FF1E27; filter: drop-shadow(0 0 4px #FF1E27); }
    }
    @keyframes tileFlicker2 {
      0%, 100% { fill: #4D000C; }
      50% { fill: #FFE600; filter: drop-shadow(0 0 4px #FFE600); }
    }
    @keyframes tileFlicker3 {
      0%, 100% { fill: #1A0004; }
      50% { fill: #00E5FF; filter: drop-shadow(0 0 4px #00E5FF); }
    }
    @keyframes pulseAlert {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #FF1E27); }
    }

    .thief-marker { animation: thiefScan 8s ease-in-out infinite alternate; }
    .tf-1 { animation: tileFlicker1 2.5s ease-in-out infinite; }
    .tf-2 { animation: tileFlicker2 3.2s ease-in-out infinite 0.7s; }
    .tf-3 { animation: tileFlicker3 4s ease-in-out infinite 1.2s; }
    .alert-pulse { animation: pulseAlert 2s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="920" height="190" rx="12" fill="url(#palaceBg)" stroke="#FF1E27" stroke-width="1.5"/>

  <!-- Top Ribbon -->
  <g transform="translate(18, 16)">
    <polygon points="0,0 280,0 265,26 0,26" fill="#FF1E27"/>
    <text x="14" y="18" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" fill="#FFF" letter-spacing="1.5">
      🏰 METAVERSE PALACE INFILTRATION GRID
    </text>

    <!-- Alert Level Badge -->
    <g transform="translate(730, 0)">
      <rect width="150" height="24" rx="4" fill="#000" stroke="#FF1E27" stroke-width="1.2" class="alert-pulse"/>
      <text x="75" y="16" font-family="'Impact', sans-serif" font-size="11" fill="#FFE600" text-anchor="middle" letter-spacing="1">
        SECURITY LEVEL: 99% ⚠️
      </text>
    </g>
  </g>

