<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="p3CardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d1c"/>
      <stop offset="100%" stop-color="#08182b"/>
    </linearGradient>

    <linearGradient id="p4TvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1602"/>
      <stop offset="100%" stop-color="#2d2305"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <linearGradient id="yellowNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <pattern id="tvScanPattern" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.8" opacity="0.4"/>
    </pattern>

    <filter id="p3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes moonFlicker {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px #00E5FF); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #00E5FF); }
    }
    @keyframes tvStatic {
      0% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 0.4; transform: translateY(2px); }
      100% { opacity: 0.25; transform: translateY(0); }
    }
    @keyframes recBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }
    @keyframes barSlide {
      0% { width: 40px; }
      50% { width: 160px; }
      100% { width: 40px; }
    }

    .moon-anim { animation: moonFlicker 3s ease-in-out infinite; }
    .tv-scan { animation: tvStatic 0.3s steps(2) infinite; }
    .rec-dot { animation: recBlink 1.2s ease-in-out infinite; }
    .bar-grow { animation: barSlide 5s ease-in-out infinite; }
  </style>

  <!-- Base Grid Background -->
  <rect width="920" height="220" rx="12" fill="#0A0812" stroke="#251E33" stroke-width="1.5"/>

  <!-- ================= LEFT PANEL: PERSONA 3 RELOAD TARTARUS OPS ================= -->
  <g transform="translate(16, 15)">
    <!-- Frame Box -->
    <rect width="435" height="190" rx="8" fill="url(#p3CardBg)" stroke="#00E5FF" stroke-width="1.5"/>
    
    <!-- Top Header Ribbon -->
    <path d="M 0 8 Q 0 0 8 0 L 260 0 L 240 28 L 0 28 Z" fill="url(#cyanNeon)"/>
    <text x="14" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" fill="#001428" letter-spacing="1.5">
      🌙 S.E.E.S. // TARTARUS EXPEDITION
    </text>

    <!-- Moon Crest Indicator -->
    <g transform="translate(395, 20)">
      <circle cx="0" cy="0" r="14" fill="#002244" stroke="#00E5FF" stroke-width="1.5" class="moon-anim"/>
      <path d="M-5, -5 A7,7 0 1,0 7, 7 A9,9 0 0,1 -5, -5 Z" fill="#00E5FF"/>
    </g>

    <!-- Missions & Quests List -->
    <g transform="translate(16, 42)">
      <!-- Quest 1 -->
      <g transform="translate(0, 0)">
        <rect width="403" height="32" rx="4" fill="#001830" stroke="#005580" stroke-width="1"/>
        <circle cx="16" cy="16" r="6" fill="#00E5FF"/>
        <text x="32" y="15" font-family="'Impact', sans-serif" font-size="11" fill="#FFFFFF">TARGET 01: COMPUTER SCIENCE DEGREE</text>
        <text x="32" y="27" font-family="'Trebuchet MS', sans-serif" font-size="9" fill="#00E5FF">Status: Ascending Tartarus Block 5 (Senior Milestones)</text>
      </g>

      <!-- Quest 2 -->
      <g transform="translate(0, 38)">
        <rect width="403" height="32" rx="4" fill="#001830" stroke="#005580" stroke-width="1"/>
        <circle cx="16" cy="16" r="6" fill="#00E676"/>
        <text x="32" y="15" font-family="'Impact', sans-serif" font-size="11" fill="#FFFFFF">TARGET 02: PYTHON &amp; AI MASTERY</text>
        <text x="32" y="27" font-family="'Trebuchet MS', sans-serif" font-size="9" fill="#00E676">Status: Summoning Neural Archs &amp; Deep Logic</text>
      </g>

      <!-- Quest 3 -->
      <g transform="translate(0, 76)">
        <rect width="403" height="32" rx="4" fill="#001830" stroke="#005580" stroke-width="1"/>
        <circle cx="16" cy="16" r="6" fill="#FFE600"/>
        <text x="32" y="15" font-family="'Impact', sans-serif" font-size="11" fill="#FFFFFF">TARGET 03: GAME DEV PARTY RECRUITMENT</text>
        <text x="32" y="27" font-family="'Trebuchet MS', sans-serif" font-size="9" fill="#FFE600">Status: Seeking Fellow Creators &amp; Wild Cards</text>
      </g>

      <!-- Bottom Status Bar -->
      <g transform="translate(0, 115)">
        <rect width="403" height="20" rx="3" fill="#001020"/>
        <text x="8" y="14" font-family="'Trebuchet MS', sans-serif" font-size="9.5" font-weight="bold" fill="#718096">
          DARK HOUR EXPEDITION: <tspan fill="#00E5FF">ACTIVE</tspan> | FLOOR: <tspan fill="#FFE600">UNLIMITED</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: PERSONA 4 GOLDEN MIDNIGHT CHANNEL TV ================= -->
  <g transform="translate(469, 15)">
    <!-- Outer TV Frame -->
    <rect width="435" height="190" rx="10" fill="url(#p4TvBg)" stroke="#FFE600" stroke-width="1.5"/>
    
    <!-- TV Antenna & Bezel styling -->
    <rect x="12" y="12" width="411" height="166" rx="6" fill="#140F00" stroke="#4D3B00" stroke-width="2"/>
    <rect x="14" y="14" width="407" height="162" rx="4" fill="url(#tvScanPattern)" class="tv-scan"/>

    <!-- TV Header -->
    <g transform="translate(24, 28)">
      <circle cx="6" cy="6" r="5" fill="#FF1744" class="rec-dot"/>
      <text x="18" y="10" font-family="'Impact', sans-serif" font-size="12" fill="#FF1744" letter-spacing="1">● LIVE</text>
      <text x="75" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" fill="#FFE600" letter-spacing="1">
        MIDNIGHT CHANNEL SPECIAL BROADCAST
      </text>
    </g>

    <!-- TV Screen Inner Content -->
    <g transform="translate(26, 52)">
      <!-- Broadcast Window -->
      <rect width="383" height="106" rx="4" fill="#1F1600" stroke="#FFE600" stroke-width="1" opacity="0.8"/>
      
      <!-- Headline -->
      <text x="14" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" fill="#FFE600">
        📺 "REACH OUT TO THE TRUTH"
      </text>
      
      <text x="14" y="44" font-family="'Trebuchet MS', sans-serif" font-size="10.5" font-weight="bold" fill="#FFFFFF">
        🎮 Inspiration: <tspan fill="#FFE600">Clair Obscur: Expedition 33</tspan>
      </text>
      <text x="14" y="60" font-family="'Trebuchet MS', sans-serif" font-size="9.5" fill="#C4B590">
        "Created by only 30 devs—proving passion and ambition conquer all."
      </text>

      <!-- Bottom Channel Banner -->
      <rect x="8" y="74" width="367" height="24" rx="3" fill="#382B00"/>
      <text x="14" y="90" font-family="'Impact', sans-serif" font-size="10.5" fill="#FFE600" letter-spacing="1">
        CH. 04 · INVESTIGATION TEAM:
      </text>
      <text x="175" y="90" font-family="'Trebuchet MS', sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF">
        "Ask me about anything!"
      </text>
    </g>
  </g>
</svg>
