<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0408"/>
      <stop offset="35%" stop-color="#14060d"/>
      <stop offset="65%" stop-color="#040b17"/>
      <stop offset="100%" stop-color="#141004"/>
    </linearGradient>

    <linearGradient id="p5Crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="100%" stop-color="#990008"/>
    </linearGradient>

    <linearGradient id="p3Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0055AA"/>
    </linearGradient>

    <linearGradient id="p4Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowP5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowP3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowP4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Halftone Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#FF1E27" opacity="0.18"/>
      <circle cx="12" cy="12" r="1.5" fill="#00E5FF" opacity="0.12"/>
    </pattern>

    <pattern id="p4Scanlines" x="0" y="0" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes floatStar {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
      50% { transform: translateY(-8px) rotate(180deg); opacity: 1; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.8; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 4px #FF1E27); }
      50% { opacity: 1; filter: drop-shadow(0 0 14px #FF1E27); }
    }
    @keyframes pulseP3 {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 5px #00E5FF); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px #00E5FF); }
    }
    @keyframes pulseP4 {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px #FFE600); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #FFE600); }
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-920px) skewX(-25deg); }
      100% { transform: translateX(920px) skewX(-25deg); }
    }
    @keyframes dialRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scanlineFlicker {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.15; }
    }

    .star-anim-1 { animation: floatStar 4s ease-in-out infinite; transform-origin: center; }
    .star-anim-2 { animation: floatStar 6s ease-in-out infinite 1s; transform-origin: center; }
    .star-anim-3 { animation: floatStar 5s ease-in-out infinite 2s; transform-origin: center; }
    .p5-pulse { animation: pulseGlow 3s ease-in-out infinite; }
    .p3-pulse { animation: pulseP3 3.5s ease-in-out infinite; }
    .p4-pulse { animation: pulseP4 3.2s ease-in-out infinite; }
    .shimmer { animation: shimmerMove 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .rot-dial { animation: dialRotate 20s linear infinite; transform-origin: 460px 48px; }
    .scanlines { animation: scanlineFlicker 0.2s steps(2) infinite; }

    .title-main {
      font-family: 'Impact', 'Arial Black', 'Montserrat', -apple-system, sans-serif;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 3px;
    }
    .title-sub {
      font-family: 'Trebuchet MS', 'Arial', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 4px;
    }
    .badge-text {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background base -->
  <rect width="920" height="280" rx="14" fill="url(#bgGrad)" stroke="#222" stroke-width="2"/>
  <rect width="920" height="280" rx="14" fill="url(#dotPattern)"/>

  <!-- Persona 5 Crimson Slashes (Left) -->
  <g>
    <polygon points="-20,0 260,0 170,280 -20,280" fill="url(#p5Crimson)" opacity="0.95"/>
    <polygon points="245,0 265,0 175,280 155,280" fill="#000000" opacity="0.6"/>
    <polygon points="270,0 280,0 190,280 180,280" fill="#FF1E27" opacity="0.8"/>
    <!-- P5 Comic Stars -->
    <polygon class="star-anim-1" points="48,45 53,58 67,58 56,66 60,80 48,72 36,80 40,66 29,58 43,58" fill="#FFF" opacity="0.9"/>
    <polygon class="star-anim-2" points="135,215 139,225 150,225 141,231 144,242 135,236 126,242 129,231 120,225 131,225" fill="#FFE600" opacity="0.9"/>
    <polygon class="star-anim-3" points="75,170 78,177 86,177 80,182 82,189 75,185 68,189 70,182 64,177 72,177" fill="#FFF" opacity="0.75"/>
    <!-- P5 Calling Card Label -->
    <rect x="25" y="115" width="130" height="22" rx="3" fill="#000000" transform="rotate(-7, 25, 115)"/>
    <text x="32" y="130" fill="#FFF" class="badge-text" transform="rotate(-7, 25, 115)">★ TAKE YOUR HEART ★</text>
  </g>

  <!-- Persona 4 Golden TV Stripes & Badge (Right) -->
  <g>
    <polygon points="730,0 940,0 940,280 640,280" fill="#181300" opacity="0.9"/>
    <!-- P4 Rainbow Stripes -->
    <polygon points="760,0 772,0 682,280 670,280" fill="#FF1E27" opacity="0.85"/>
    <polygon points="776,0 788,0 698,280 686,280" fill="#FF7700" opacity="0.85"/>
    <polygon points="792,0 804,0 714,280 702,280" fill="#FFE600" opacity="0.85"/>
    <polygon points="808,0 820,0 730,280 718,280" fill="#00CC66" opacity="0.85"/>
    <polygon points="824,0 836,0 746,280 734,280" fill="#00BFFF" opacity="0.85"/>
    <!-- P4 Golden Badge -->
    <g transform="translate(735, 30) rotate(5)">
      <rect x="0" y="0" width="155" height="42" rx="6" fill="url(#p4Gold)" stroke="#000" stroke-width="2" filter="url(#glowP4)"/>
      <rect x="4" y="4" width="147" height="34" rx="4" fill="none" stroke="#000" stroke-dasharray="4,2"/>
      <text x="77" y="26" fill="#000" font-family="'Impact', 'Arial Black', sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="1">MIDNIGHT CHANNEL</text>
    </g>
    <rect x="640" y="0" width="280" height="280" fill="url(#p4Scanlines)" class="scanlines" clip-path="url(#rightClip)"/>
  </g>

  <!-- Persona 3 Reload Dark Hour Dial & Moon (Center Top) -->
  <g>
    <!-- Glowing Tartarus Moon Dial -->
    <circle cx="460" cy="48" r="42" fill="#001428" stroke="url(#p3Cyan)" stroke-width="2.5" filter="url(#glowP3)" class="p3-pulse"/>
    <!-- Rotating Dial Markings -->
    <g class="rot-dial">
      <circle cx="460" cy="48" r="36" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>
      <line x1="460" y1="12" x2="460" y2="20" stroke="#00E5FF" stroke-width="2"/>
      <line x1="460" y1="76" x2="460" y2="84" stroke="#00E5FF" stroke-width="2"/>
      <line x1="424" y1="48" x2="432" y2="48" stroke="#00E5FF" stroke-width="2"/>
      <line x1="488" y1="48" x2="496" y2="48" stroke="#00E5FF" stroke-width="2"/>
    </g>
    <!-- Clock Center Phase -->
    <circle cx="460" cy="48" r="26" fill="#002244"/>
    <!-- Full Moon / Evoker silhouette -->
    <path d="M448,48 A12,12 0 1,0 472,48 A12,12 0 0,1 448,48 Z" fill="#00E5FF" opacity="0.9"/>
    <!-- Dark Hour 12:00 Label -->
    <rect x="410" y="98" width="100" height="18" rx="3" fill="#001f3f" stroke="#00E5FF" stroke-width="1"/>
    <text x="460" y="111" fill="#00E5FF" font-family="'Impact', 'Arial Black', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">12:00 AM DARK HOUR</text>
  </g>

  <!-- Main Center Banner Typography -->
  <g transform="translate(0, 10)">
    <!-- Codename Tag -->
    <g transform="translate(460, 126)">
      <rect x="-140" y="0" width="280" height="22" rx="4" fill="#111" stroke="#FF1E27" stroke-width="1.5"/>
      <text x="0" y="15" fill="#FFE600" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="3">
        ⚔️ TRICKSTER · WILD CARD BEARER ⚔️
      </text>
    </g>

    <!-- Main Name (Persona Cutout Style) -->
    <!-- 3D Shadow Layers -->
    <text x="464" y="186" fill="#000000" class="title-main" text-anchor="middle">JAIRUS ESPINA</text>
    <text x="462" y="184" fill="#990008" class="title-main" text-anchor="middle">JAIRUS ESPINA</text>
    <text x="460" y="182" fill="#FFFFFF" class="title-main p5-pulse" text-anchor="middle">JAIRUS ESPINA</text>

    <!-- Subtitle Bar with 3-Game Colors -->
    <g transform="translate(460, 202)">
      <!-- Left Red Wing (P5R) -->
      <polygon points="-280,0 -80,0 -95,24 -295,24" fill="url(#p5Crimson)"/>
      <text x="-185" y="16" fill="#FFF" class="badge-text" text-anchor="middle">PERSONA 5 ROYAL</text>

      <!-- Center Blue Gem (P3R) -->
      <polygon points="-75,0 75,0 60,24 -90,24" fill="url(#p3Cyan)"/>
      <text x="-8" y="16" fill="#001428" class="badge-text" text-anchor="middle">PERSONA 3 RELOAD</text>

      <!-- Right Gold Wing (P4G) -->
      <polygon points="80,0 280,0 265,24 65,24" fill="url(#p4Gold)"/>
      <text x="175" y="16" fill="#000" class="badge-text" text-anchor="middle">PERSONA 4 GOLDEN</text>
    </g>

    <!-- Tagline -->
    <text x="460" y="248" fill="#D0E6FF" class="title-sub" text-anchor="middle">
      GAME DEV CRUSADER · COMPUTER SCIENCE · AI RESEARCHER
    </text>
  </g>

  <!-- Animated Shimmer Sweep -->
  <rect x="0" y="0" width="220" height="280" fill="url(#shimmerGrad)" class="shimmer" pointer-events="none"/>

  <!-- Border Accents -->
  <rect x="4" y="4" width="912" height="272" rx="10" fill="none" stroke="#FF1E27" stroke-width="1.5" opacity="0.4"/>
</svg>
