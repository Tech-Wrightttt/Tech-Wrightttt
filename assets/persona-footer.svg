<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="35%" stop-color="#0b1736"/>
      <stop offset="70%" stop-color="#180a1c"/>
      <stop offset="100%" stop-color="#080208"/>
    </linearGradient>

    <linearGradient id="velvetBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#8A2387"/>
    </linearGradient>

    <filter id="butterflyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes butterflyFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(15px, -12px) scale(0.9) rotate(5deg); }
      50% { transform: translate(30px, -4px) scale(1.1) rotate(-5deg); }
      75% { transform: translate(15px, 10px) scale(0.95) rotate(3deg); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes butterflyFloat2 {
      0% { transform: translate(0, 0) scale(0.85); }
      30% { transform: translate(-20px, -15px) scale(0.95) rotate(-6deg); }
      70% { transform: translate(-35px, 8px) scale(0.8) rotate(4deg); }
      100% { transform: translate(0, 0) scale(0.85); }
    }
    @keyframes footerGlowPulse {
      0%, 100% { filter: drop-shadow(0 0 3px #00D2FF); }
      50% { filter: drop-shadow(0 0 10px #00D2FF); }
    }
    @keyframes cardShimmer {
      0% { transform: translateX(-920px); }
      100% { transform: translateX(920px); }
    }

    .bf-1 { animation: butterflyFloat1 7s ease-in-out infinite; }
    .bf-2 { animation: butterflyFloat2 8.5s ease-in-out infinite; }
    .footer-pulse { animation: footerGlowPulse 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="920" height="150" rx="12" fill="url(#footerBg)" stroke="#1a2b4c" stroke-width="1.5"/>

  <!-- Top Glowing Velvet Divider -->
  <line x1="0" y1="2" x2="920" y2="2" stroke="url(#velvetBlue)" stroke-width="3" opacity="0.8"/>

  <!-- Blue Morpho Butterfly Left (Velvet Room / Philemon) -->
  <g class="bf-1" transform="translate(100, 70)" filter="url(#butterflyGlow)">
    <!-- Wings -->
    <path d="M0,0 C-18,-30 -35,-25 -28,5 C-22,25 -5,12 0,0 Z" fill="#00D2FF" opacity="0.85"/>
    <path d="M0,0 C18,-30 35,-25 28,5 C22,25 5,12 0,0 Z" fill="#00D2FF" opacity="0.85"/>
    <path d="M0,0 C-14,10 -25,28 -10,30 C-2,32 0,15 0,0 Z" fill="#3A7BD5" opacity="0.9"/>
    <path d="M0,0 C14,10 25,28 10,30 C2,32 0,15 0,0 Z" fill="#3A7BD5" opacity="0.9"/>
    <!-- Body -->
    <ellipse cx="0" cy="5" rx="2" ry="12" fill="#FFFFFF"/>
  </g>

  <!-- Blue Morpho Butterfly Right -->
  <g class="bf-2" transform="translate(820, 65)" filter="url(#butterflyGlow)">
    <path d="M0,0 C-18,-30 -35,-25 -28,5 C-22,25 -5,12 0,0 Z" fill="#00E5FF" opacity="0.85"/>
    <path d="M0,0 C18,-30 35,-25 28,5 C22,25 5,12 0,0 Z" fill="#00E5FF" opacity="0.85"/>
    <path d="M0,0 C-14,10 -25,28 -10,30 C-2,32 0,15 0,0 Z" fill="#0077B6" opacity="0.9"/>
    <path d="M0,0 C14,10 25,28 10,30 C2,32 0,15 0,0 Z" fill="#0077B6" opacity="0.9"/>
    <ellipse cx="0" cy="5" rx="2" ry="12" fill="#FFFFFF"/>
  </g>

  <!-- Center Velvet Room Contract Seal -->
  <g transform="translate(460, 32)">
    <circle cx="0" cy="0" r="18" fill="#0A1832" stroke="#00D2FF" stroke-width="1.5" class="footer-pulse"/>
    <text x="0" y="5" font-family="'Cinzel', 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#00D2FF" text-anchor="middle">V</text>
  </g>

  <!-- Contract Text -->
  <text x="460" y="78" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-style="italic" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">
    "I have accepted the contract of my own free will."
  </text>

  <!-- Three Game Ideals -->
  <g transform="translate(460, 110)">
    <!-- P3 -->
    <text x="-210" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#00E5FF" text-anchor="middle" letter-spacing="1">
      🌑 MEMENTO MORI
    </text>
    <text x="-120" y="0" fill="#4B6584" font-size="12">|</text>
    <!-- P4 -->
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#FFE600" text-anchor="middle" letter-spacing="1">
      📺 REACH OUT TO THE TRUTH
    </text>
    <text x="120" y="0" fill="#4B6584" font-size="12">|</text>
    <!-- P5 -->
    <text x="210" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#FF1E27" text-anchor="middle" letter-spacing="1">
      🎭 TAKE YOUR HEART
    </text>
  </g>

  <text x="460" y="132" font-family="'Trebuchet MS', sans-serif" font-size="10" font-weight="bold" fill="#6C7A89" text-anchor="middle" letter-spacing="2">
    © JAIRUS ESPINA (TECH-WRIGHTTT) · VELVET ROOM ARCHIVES
  </text>
</svg>
