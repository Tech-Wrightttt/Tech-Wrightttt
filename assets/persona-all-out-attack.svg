<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="100%" height="100%">
  <defs>
    <linearGradient id="aoaBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="30%" stop-color="#B30008"/>
      <stop offset="70%" stop-color="#140204"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="aoaShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="aoaDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#000000" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes speedlineShift {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-40px); }
    }
    @keyframes starPulseAoa {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
      50% { transform: scale(1.25) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 6px #FFE600); }
    }
    @keyframes textGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #000); }
      50% { filter: drop-shadow(0 0 8px #FF1E27); }
    }
    @keyframes aoaShimmerMove {
      0% { transform: translateX(-920px) skewX(-30deg); }
      100% { transform: translateX(920px) skewX(-30deg); }
    }

    .speedlines { animation: speedlineShift 0.4s linear infinite; }
    .star-aoa-1 { animation: starPulseAoa 3s ease-in-out infinite; transform-origin: 80px 40px; }
    .star-aoa-2 { animation: starPulseAoa 4s ease-in-out infinite 1s; transform-origin: 820px 110px; }
    .star-aoa-3 { animation: starPulseAoa 3.5s ease-in-out infinite 1.5s; transform-origin: 220px 130px; }
    .aoa-glow { animation: textGlow 2.5s ease-in-out infinite; }
    .aoa-shimmer { animation: aoaShimmerMove 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  </style>

  <!-- Background Base -->
  <rect width="920" height="160" rx="10" fill="url(#aoaBg)" stroke="#FF1E27" stroke-width="2"/>
  <rect width="920" height="160" rx="10" fill="url(#aoaDots)"/>

  <!-- Dynamic Slashed Black & Crimson Triangles -->
  <polygon points="0,0 340,0 240,160 0,160" fill="#FF1E27" opacity="0.9"/>
  <polygon points="320,0 360,0 260,160 220,160" fill="#000000" opacity="0.8"/>
  <polygon points="560,0 620,0 520,160 460,160" fill="#FF1E27" opacity="0.3"/>
  <polygon points="780,0 920,0 920,160 700,160" fill="#0A0A0A" opacity="0.95"/>

  <!-- Speedlines -->
  <g class="speedlines" opacity="0.25">
    <line x1="-20" y1="20" x2="940" y2="20" stroke="#FFF" stroke-width="1.5" stroke-dasharray="80,40"/>
    <line x1="-20" y1="50" x2="940" y2="50" stroke="#FFF" stroke-width="1" stroke-dasharray="120,60"/>
    <line x1="-20" y1="110" x2="940" y2="110" stroke="#FFF" stroke-width="1" stroke-dasharray="100,50"/>
    <line x1="-20" y1="140" x2="940" y2="140" stroke="#FFF" stroke-width="1.5" stroke-dasharray="70,30"/>
  </g>

  <!-- Stars -->
  <polygon class="star-aoa-1" points="80,28 84,38 95,38 86,44 89,55 80,49 71,55 74,44 65,38 76,38" fill="#FFE600"/>
  <polygon class="star-aoa-2" points="820,98 824,108 835,108 826,114 829,125 820,119 811,125 814,114 805,108 816,108" fill="#FFE600"/>
  <polygon class="star-aoa-3" points="220,118 223,125 231,125 224,129 227,137 220,132 213,137 216,129 209,125 217,125" fill="#FFF"/>

  <!-- All Out Attack Finisher Text -->
  <g transform="translate(0, 0)">
    <!-- Top Sub-Banner -->
    <rect x="40" y="22" width="220" height="24" fill="#000000" transform="rotate(-3, 40, 22)"/>
    <text x="50" y="38" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" fill="#FFE600" transform="rotate(-3, 40, 22)" letter-spacing="2">
      ★ ALL-OUT ATTACK FINISH ★
    </text>

    <!-- Main Dramatic Catchphrase -->
    <text x="460" y="90" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="4">
      "THE SHOW'S OVER."
    </text>
    <text x="458" y="88" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#FFE600" text-anchor="middle" letter-spacing="4">
      "THE SHOW'S OVER."
    </text>
    <text x="456" y="86" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" class="aoa-glow" text-anchor="middle" letter-spacing="4">
      "THE SHOW'S OVER."
    </text>

    <!-- Sub-Punchline -->
    <g transform="translate(460, 126)">
      <rect x="-260" y="-14" width="520" height="26" rx="4" fill="#000000" stroke="#FF1E27" stroke-width="1.5"/>
      <text x="0" y="4" font-family="'Trebuchet MS', 'Arial', sans-serif" font-size="12" font-weight="900" fill="#FFE600" text-anchor="middle" letter-spacing="3">
        CRITICAL HIT! ALL BUGS ELIMINATED · VICTORY ACHIEVED
      </text>
    </g>
  </g>

  <!-- Shimmer -->
  <rect x="0" y="0" width="200" height="160" fill="url(#aoaShimmer)" class="aoa-shimmer" pointer-events="none"/>
</svg>
